<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progreso de usuarios</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 32px;
      background: #f4f7fb;
      color: #263445;
      font-family: Arial, sans-serif;
    }

    /* Botón superior izquierdo */
    .boton-inicio {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 10px 18px;
      border-radius: 10px;
      background: #0876bd;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .boton-inicio:hover {
      background: #065d96;
    }

    h1 {
      margin: 0 0 28px;
      color: #263445;
      font-size: 28px;
      text-align: center;
    }

    /* Contenedor principal tipo tarjeta */
    #contenedor {
      position: relative;
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 36px 40px;
      background: #fff;
      border: 1px solid #e5eaf0;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(38, 52, 69, 0.06);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    /* Ocultar línea divisoria que genera app.js */
    #contenedor hr {
      display: none !important;
    }

    /* Foto de perfil (cambia la ruta por la de tu carpeta de imágenes) */
    #contenedor::before {
      content: "";
      position: absolute;
      top: 36px;
      left: 40px;
      width: 68px;
      height: 68px;
      border-radius: 10px;
      background: #e6f4ff url('imagenes/perfil.jpg') center/cover no-repeat;
      border: 1px solid #e5eaf0;
    }

    /* Caja de vidas debajo de foto y nombre */
    #contenedor::after {
      content: "💗  5 vidas";
      position: absolute;
      top: 118px;
      left: 40px;
      width: 310px;
      padding: 12px 16px;
      border: 1px solid #e5eaf0;
      border-radius: 12px;
      background: #fff;
      font-size: 15px;
      font-weight: 600;
      color: #263445;
    }

    /* Bloque superior derecho: Fuego + 10 días de racha + Botón */
    .racha-flotante {
      position: absolute;
      top: 36px;
      right: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .racha-flotante .fuego {
      font-size: 28px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .racha-flotante .texto {
      font-size: 15px;
      color: #526174;
      margin-bottom: 12px;
    }

    .racha-flotante .texto strong {
      color: #263445;
      font-size: 18px;
    }

    .racha-flotante .btn-racha {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      background: #c76a12;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .racha-flotante .btn-racha:hover {
      background: #a8560c;
    }

    /* Nombre del usuario (h2 de app.js) */
    #contenedor h2 {
      grid-column: 1 / 3;
      order: 1;
      margin: 0 0 65px 84px;
      padding: 10px 16px;
      border: 1px solid #e5eaf0;
      border-radius: 10px;
      font-size: 19px;
      color: #263445;
      width: fit-content;
      min-width: 170px;
    }

    #contenedor h2::after {
      content: "nombre de usuario";
      display: block;
      margin-top: 3px;
      font-size: 12px;
      font-weight: 400;
      color: #7b8898;
    }

    /* Párrafos de datos generales */
    #contenedor p {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 14px;
      color: #526174;
      line-height: 1.4;
    }

    /* Orden de los datos */
    #contenedor p:nth-of-type(1) { order: 2; } /* Email */
    #contenedor p:nth-of-type(2) { order: 3; } /* País */
    #contenedor p:nth-of-type(3) { order: 4; } /* Nivel */
    #contenedor p:nth-of-type(7) { order: 5; } /* Curso */
    #contenedor p:nth-of-type(8) { order: 6; } /* Fecha */

    /* Título "Progreso" (h3 de app.js) */
    #contenedor h3 {
      grid-column: 1 / -1;
      order: 7;
      margin: 18px 0 4px;
      font-size: 17px;
      color: #263445;
    }

    /* Las 3 tarjetas de colores alineadas en 3 columnas */
    #contenedor p:nth-of-type(4),
    #contenedor p:nth-of-type(5),
    #contenedor p:nth-of-type(6) {
      min-height: 125px;
      padding: 20px 12px;
      border-radius: 14px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Tarjeta 1: Racha (Naranja) */
    #contenedor p:nth-of-type(6) {
      grid-column: 1 / 2 !important;
      order: 8 !important;
      background: #fff0df;
      color: #c76a12;
    }
    #contenedor p:nth-of-type(6)::before {
      content: "🔥";
      font-size: 22px;
    }

    /* Tarjeta 2: Experiencia (Morado) */
    #contenedor p:nth-of-type(5) {
      grid-column: 2 / 3 !important;
      order: 9 !important;
      background: #f0eaff;
      color: #7041bd;
    }
    #contenedor p:nth-of-type(5)::before {
      content: "⚡";
      font-size: 22px;
    }

    /* Tarjeta 3: Porcentaje (Azul) */
    #contenedor p:nth-of-type(4) {
      grid-column: 3 / 4 !important;
      order: 10 !important;
      background: #e6f4ff;
      color: #0876bd;
    }
    #contenedor p:nth-of-type(4)::before {
      content: "🎯";
      font-size: 22px;
    }

    @media (max-width: 640px) {
      #contenedor {
        grid-template-columns: 1fr;
        padding: 24px 20px;
      }
      .racha-flotante {
        position: static;
        order: 1;
        margin-bottom: 12px;
      }
      #contenedor h2 {
        grid-column: 1 / -1;
      }
      #contenedor::after {
        width: calc(100% - 40px);
      }
      #contenedor p:nth-of-type(4),
      #contenedor p:nth-of-type(5),
      #contenedor p:nth-of-type(6) {
        grid-column: 1 / -1 !important;
      }
    }
  </style>
</head>
<body>
  <a class="boton-inicio" href="index.html">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
      <path d="M12 3 2.5 11h2.7v9h5.1v-5.8h3.4V20h5.1v-9h2.7L12 3z"/>
    </svg>
    <span>Regresar al inicio</span>
  </a>

  <h1>Mi Perfil</h1>

  <div id="contenedor"></div>

  <script src="app.js"></script>
  <script>
    // Agrega el bloque de racha en la esquina superior derecha sin alterar los datos de app.js
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const contenedor = document.getElementById('contenedor');
        if (contenedor && !contenedor.querySelector('.racha-flotante')) {
          const rachaDiv = document.createElement('div');
          rachaDiv.className = 'racha-flotante';
          rachaDiv.innerHTML = `
            <div class="fuego">🔥</div>
            <div class="texto"><strong>10</strong> días de racha</div>
            <button type="button" class="btn-racha">Ver días de racha</button>
          `;
          contenedor.appendChild(rachaDiv);
        }
      }, 100);
    });
  </script>
</body>
</html>
